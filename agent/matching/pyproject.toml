[project]
name = "matching"
version = "0.1.0"
description = "Fit-scoring module: hybrid_search(job_posting, source_of_truth) for the job-application automation agent"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "nltk",
    "sentence-transformers",
    "pydantic",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
